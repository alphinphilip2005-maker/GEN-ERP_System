<div class="login-wrapper">
  
  <div class="login-left">
    <!-- Blue Illustration Area -->
    <div class="illustration-container">
      <div class="iso-base"></div>
      <div class="iso-bar bar-1"></div>
      <div class="iso-bar bar-2"></div>
      <div class="iso-bar bar-3"></div>
      <div class="chart-slice"></div>
      <div class="dot dot-1"></div>
      <div class="dot dot-2"></div>
      <div class="iso-server"></div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-box">
      <div class="logo-area">
        <div class="gold-badge">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="#000"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1>Welcome to Gen ERP</h1>
        <p class="sub-tagline">It is a long established fact that a reader will be<br>distracted by the readable content.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label>Email <span class="text-danger">*</span></label>
          <input 
            type="text" 
            name="email" 
            [(ngModel)]="loginData.email" 
            placeholder="muralidharan@genex.com"
            required>
        </div>

        <div class="form-group">
          <label>Password <span class="text-danger">*</span></label>
          <input 
            type="password" 
            name="password" 
            [(ngModel)]="loginData.password" 
            placeholder="•••••••••"
            required>
        </div>

        <div class="form-footer">
          <label class="remember-me">
            <input type="checkbox" name="rememberMe" [(ngModel)]="loginData.rememberMe">
            Remember me
          </label>
          <a href="#" class="forgot-pass">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" [disabled]="!loginForm.valid">Login</button>
      </form>
    </div>
  </div>

</div>

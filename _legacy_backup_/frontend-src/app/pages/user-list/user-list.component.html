<div class="list-container">
  
  <div class="list-header">
    <h2 class="title">User management List</h2>
    <div class="actions">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search by ID or Name" (input)="onSearch($event)">
      </div>
      <button class="btn-add" routerLink="/admin/users/create">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
    </div>
  </div>

  <div class="pagination-hint">
    <span class="page-selector">‹ Page 1 of 5 ›</span>
  </div>

  <div class="user-grid">
    <div class="user-card" *ngFor="let user of users">
      <div class="card-details">
        <div class="detail-row">
          <span class="label">Name</span>
          <span class="value">: {{ user.name }}</span>
        </div>
        <div class="detail-row">
          <span class="label">Emp.ID</span>
          <span class="value">: {{ user.empId }}</span>
        </div>
        <div class="detail-row">
          <span class="label">Designation</span>
          <span class="value">: {{ user.designation }}</span>
        </div>
      </div>
      <div class="card-actions">
        <button class="action-btn edit-btn" title="Edit">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="action-btn next-btn" title="View Rights">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#ff8c00" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

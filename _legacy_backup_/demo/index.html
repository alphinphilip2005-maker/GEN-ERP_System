<!DOCTYPE html>
<html lang="en" ng-app="erpApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen ERP - Management System</title>
    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --gold: #c9a72b;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --sidebar-bg: #eef1f9;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); color: var(--text-main); line-height: 1.5; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* --- Login Page --- */
        .login-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        .login-left { 
            flex: 1.1; 
            background: linear-gradient(145deg, #448df1 0%, #3065ee 100%); 
            display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden; 
        }
        .illustration-container { 
            width: 100%; height: 100%; 
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><path fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" d="M0 300 L400 100 L800 300 L400 500 Z"/><g transform="translate(400,300) scale(1.2)"><path fill="%23FFFFFF" opacity="0.1" d="M-150 0 L0 -75 L150 0 L0 75 Z"/><rect fill="%233b82f6" x="-80" y="-120" width="30" height="150" rx="6" opacity="0.8"/><rect fill="%23ef4444" x="-40" y="-80" width="30" height="110" rx="6" opacity="0.8"/><rect fill="%23c9a72b" x="0" y="-50" width="30" height="80" rx="6" opacity="0.9"/><circle fill="%23fff" cx="80" cy="0" r="15" opacity="0.4"/></g></svg>') center center no-repeat;
            background-size: cover;
        }
        .login-right { flex: 0.9; display: flex; align-items: center; justify-content: center; background: #fff; }
        .login-box { width: 100%; max-width: 420px; padding: 40px; }
        .logo-area { text-align: center; margin-bottom: 40px; }
        .gold-badge { width: 64px; height: 64px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 10px 15px -3px rgba(201, 167, 43, 0.3); }
        .logo-area h1 { font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 12px; letter-spacing: -0.5px; }
        .logo-area .sub-tagline { color: var(--text-muted); font-size: 14px; line-height: 1.6; }

        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 10px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-light); font-size: 14px; transition: all 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        
        .form-footer { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 13px; }
        .remember-me { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; font-weight: 500; }
        .btn-login { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }
        .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }

        /* --- Admin Layout --- */
        .admin-wrapper { display: flex; height: 100vh; width: 100vw; background: var(--bg-light); }
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 100; }
        .sidebar-header { padding: 32px 24px; }
        .logo-container { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 16px; color: var(--gold); letter-spacing: 0.5px; }
        .logo-shield { width: 24px; height: 28px; background: var(--gold); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; align-items: center; justify-content: center; }
        .logo-shield::after { content: ''; width: 8px; height: 12px; background: var(--sidebar-bg); border-radius: 2px; }
        
        .sidebar-nav { flex: 1; padding-top: 10px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 14px; padding: 16px 28px; text-decoration: none; color: #64748b; font-size: 14px; font-weight: 600; position: relative; transition: 0.2s; }
        .sidebar-nav a:hover { color: var(--primary); background: rgba(59, 130, 246, 0.05); }
        .sidebar-nav a.active { background: #fff; color: #0f172a; font-weight: 700; border-radius: 0 30px 30px 0; margin-right: 10px; }
        .sidebar-nav a.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
        .top-header { height: 74px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 40px; justify-content: flex-end; }
        .header-actions { display: flex; align-items: center; gap: 24px; }
        .notification-btn { width: 40px; height: 40px; border-radius: 50%; background: #f0f7ff; border: none; display: flex; align-items: center; justify-content: center; color: var(--primary); cursor: pointer; transition: 0.2s; }
        .user-profile { display: flex; align-items: center; gap: 16px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 700; font-size: 14px; color: var(--primary); display: block; }
        .user-email { font-size: 11px; color: var(--text-muted); display: block; margin-top: 2px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }

        .page-content { flex: 1; padding: 40px; overflow-y: auto; background: #fff; }

        /* --- User Management List --- */
        .list-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
        .list-header h2 { font-size: 17px; font-weight: 700; color: var(--primary); position: relative; margin: 0; }
        .list-header h2::after { content: ''; position: absolute; bottom: -14px; left: 0; width: 100%; height: 2px; background: var(--primary); }
        .actions { display: flex; align-items: center; gap: 16px; }
        .search-box { position: relative; }
        .search-box input { width: 280px; padding: 11px 16px 11px 44px; border: none; border-radius: 10px; font-size: 13px; background: #f1f5f9; color: #1e293b; outline: none; transition: 0.2s; }
        .search-box input:focus { background: #e2e8f0; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .btn-add { padding: 11px 24px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.2s; }

        .pagination-hint { text-align: right; margin-bottom: 20px; font-size: 12px; color: #94a3b8; font-weight: 600; letter-spacing: 0.5px; }
        
        .user-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .user-card { background: #f8fafc; border-radius: 12px; padding: 24px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 1px solid transparent; }
        .user-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -5px rgba(0,0,0,0.05); background: #fff; border-color: var(--border); }
        .card-details { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .detail-row { display: flex; font-size: 13px; }
        .label { width: 95px; color: #475569; font-weight: 700; }
        .value { color: #1e293b; font-weight: 500; }
        .card-actions { display: flex; flex-direction: column; gap: 16px; padding-left: 20px; border-left: 1px dashed #cbd5e1; }
        .box-icon { width: 28px; height: 28px; background: #fff; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #94a3b8; cursor: pointer; transition: 0.2s; }
        .box-icon:hover { color: var(--primary); border-color: var(--primary); }
        .box-icon-orange:hover { color: #f97316; border-color: #f97316; }

        /* --- User Create Form --- */
        .form-container { display: flex; flex-direction: column; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px 32px; margin-top: 20px; margin-bottom: 40px; }
        .input-group { display: flex; flex-direction: column; position: relative; }
        .input-group label { position: absolute; top: -10px; left: 12px; background: #fff; padding: 0 6px; font-size: 12px; font-weight: 700; color: var(--primary); z-index: 10; }
        .input-group input, .input-group select { padding: 15px 18px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; background: #fff; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); }
        .required { color: #ef4444; }
        
        .form-footer-actions { display: flex; justify-content: flex-end; padding-top: 32px; border-top: 1px solid var(--border); }
        .btn-register { padding: 15px 64px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }

        /* --- Modal --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: #fff; width: 100%; max-width: 640px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-header { padding: 28px 36px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 19px; font-weight: 800; color: #1e293b; }
        .close-btn { background: #f1f5f9; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 20px; }
        .modal-body { padding: 36px; overflow-y: auto; background: #f8fafc; }
        .rights-list { list-style: none; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .rights-item { border-bottom: 1px solid var(--border); }
        .rights-item:last-child { border-bottom: none; }
        .rights-header { padding: 18px 24px; display: flex; align-items: center; gap: 14px; cursor: pointer; color: #334155; font-weight: 600; font-size: 15px; }
        .rights-header:hover { background: #fdfdfd; }
        .exp-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #cbd5e1; border-radius: 4px; font-size: 14px; color: #94a3b8; }
        .rights-panel { background: #f1f5f9; padding: 20px 24px 24px 56px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--border); }
        .chk-group { display: flex; gap: 24px; flex-wrap: wrap; }
        .chk-label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #64748b; cursor: pointer; }
        .chk-label input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
        .modal-footer { padding: 24px 36px; border-top: 1px solid #f1f5f9; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        .btn-cancel { padding: 12px 32px; background: #f1f5f9; color: #64748b; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-submit { padding: 12px 32px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>

    <div ng-view style="height: 100vh;"></div>

    <!-- Login Template -->
    <script type="text/ng-template" id="login.html">
        <div class="login-wrapper">
            <div class="login-left">
                <div class="illustration-container"></div>
            </div>
            <div class="login-right">
                <div class="login-box">
                    <div class="logo-area">
                        <div class="gold-badge">
                            <svg viewBox="0 0 24 24" width="32" height="32" fill="#fff"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <h1>Welcome to Gen ERP</h1>
                        <p class="sub-tagline">Access the powerful management dashboard with your professional credentials.</p>
                    </div>
                    <form ng-submit="login()">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" ng-model="user.email" placeholder="muralidharan@genex.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" ng-model="user.password" placeholder="•••••••••" required>
                        </div>
                        <div class="form-footer">
                            <label class="remember-me">
                                <input type="checkbox"> Remember me
                            </label>
                            <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn-login">Login to Dashboard</button>
                    </form>
                </div>
            </div>
        </div>
    </script>

    <!-- Admin Layout Template -->
    <script type="text/ng-template" id="admin.html">
        <div class="admin-wrapper">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="logo-container">
                        <div class="logo-shield"></div>
                        <span>GEN ROBOTICS</span>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <a href="#!/admin/dashboard" ng-class="{active: activePath == '/admin/dashboard'}">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Dashboard
                    </a>
                    <a href="#!/admin/users" ng-class="{active: activePath.includes('/admin/users')}">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        User Management
                    </a>
                    
                    <div style="margin: 24px 28px 12px; font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px;">ERP Core Modules</div>
                    
                    <a href="#!/admin/bom" ng-class="{active: activePath == '/admin/bom'}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        BOM Management
                    </a>
                    <a href="#!/admin/purchase" ng-class="{active: activePath == '/admin/purchase'}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        Procurement
                    </a>
                    <a href="#!/admin/grn" ng-class="{active: activePath == '/admin/grn'}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                        GRN
                    </a>
                    <a href="#!/admin/iqc" ng-class="{active: activePath == '/admin/iqc'}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Quality Control (IQC)
                    </a>
                    <a href="#!/admin/stock" ng-class="{active: activePath == '/admin/stock'}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6" y2="6.01"/><line x1="6" y1="18" x2="6" y2="18.01"/></svg>
                        Stock Inventory
                    </a>
                </nav>
            </aside>
            <div class="main-content">
                <header class="top-header">
                    <div class="header-actions">
                        <button class="notification-btn">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        </button>
                        <div class="user-profile">
                            <div class="user-info">
                                <span class="user-name">Admin User</span>
                                <span class="user-email">admin@genrobotics.com</span>
                            </div>
                            <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" alt="Avatar" class="avatar">
                        </div>
                    </div>
                </header>
                <div class="page-content" ng-view></div>
            </div>
        </div>
    </script>

    <!-- User List Template -->
    <script type="text/ng-template" id="user-list.html">
        <div class="list-header">
            <h2>User management List</h2>
            <div class="actions">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search by ID or Name" ng-model="q">
                </div>
                <a href="#!/admin/users/create" class="btn-add">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add
                </a>
            </div>
        </div>
        
        <div class="pagination-hint">Showing {{ (users | filter:q).length }} Users &gt;</div>
        
        <div class="user-grid">
            <div class="user-card" ng-repeat="u in users | filter:q track by $index">
                <div class="card-details">
                    <div class="detail-row"><span class="label">Name</span><span class="value">: {{u.name}}</span></div>
                    <div class="detail-row"><span class="label">Emp.ID</span><span class="value">: {{u.empId}}</span></div>
                    <div class="detail-row"><span class="label">Designation</span><span class="value">: {{u.designation}}</span></div>
                </div>
                <div class="card-actions">
                    <div class="box-icon" title="Edit"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
                    <div class="box-icon box-icon-orange" title="View Details"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></div>
                </div>
            </div>
        </div>
    </script>

    <!-- User Create Template -->
    <script type="text/ng-template" id="user-create.html">
        <div class="list-header">
            <h2>Add user</h2>
            <div class="actions">
                <button type="button" class="btn-add" style="background:none; border: 1.5px solid var(--primary); color: var(--primary);" ng-click="showRightsModal = true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Configure User Rights
                </button>
            </div>
        </div>
        
        <form ng-submit="saveUser()" class="form-container">
            <div class="form-grid">
                <div class="input-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" ng-model="newUser.name" placeholder="Enter Full Name" required>
                </div>
                <div class="input-group">
                    <label>Employee ID <span class="required">*</span></label>
                    <input type="text" ng-model="newUser.empId" placeholder="GenX-0123" required>
                </div>
                <div class="input-group">
                    <label>Professional Email <span class="required">*</span></label>
                    <input type="email" ng-model="newUser.email" placeholder="user@genrobotics.com" required>
                </div>
                <div class="input-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="text" ng-model="newUser.phone" placeholder="+91 00000 00000" required>
                </div>
                <div class="input-group">
                    <label>Designation <span class="required">*</span></label>
                    <select ng-model="newUser.designation" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="Executive">Executive</option>
                        <option value="Manager">Manager</option>
                        <option value="Team Lead">Team Lead</option>
                        <option value="Developer">Developer</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Department <span class="required">*</span></label>
                    <select ng-model="newUser.department" required>
                        <option value="" disabled selected>Select Dept</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Operations">Operations</option>
                        <option value="HR">Human Resources</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Initial Password <span class="required">*</span></label>
                    <input type="password" placeholder="•••••••••" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password <span class="required">*</span></label>
                    <input type="password" placeholder="•••••••••" required>
                </div>
            </div>
            <div class="form-footer-actions">
                <button type="submit" class="btn-register">Complete Registration</button>
            </div>
        </form>

        <div class="modal-overlay" ng-show="showRightsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Configure Module Access</h3>
                    <button class="close-btn" type="button" ng-click="showRightsModal = false">&times;</button>
                </div>
                <div class="modal-body">
                    <ul class="rights-list">
                        <li class="rights-item" ng-repeat="r in rights">
                            <div class="rights-header" ng-click="r.expanded = !r.expanded">
                                <span class="exp-icon">{{ r.expanded ? '-' : '+' }}</span>
                                {{ r.name }}
                            </div>
                            <div class="rights-panel" ng-show="r.expanded">
                                <div style="display:flex; justify-content: flex-end; margin-bottom: 12px;">
                                    <label class="chk-label"><input type="checkbox" ng-model="r.all" ng-change="toggleAll(r)"> <b>Grant All Privileges</b></label>
                                </div>
                                <div class="chk-group">
                                    <label class="chk-label" ng-repeat="opt in r.options">
                                        <input type="checkbox" ng-model="opt.selected"> {{ opt.name }}
                                    </label>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" ng-click="showRightsModal = false">Discard Changes</button>
                    <button type="button" class="btn-submit" ng-click="showRightsModal = false">Save Configuration</button>
                </div>
            </div>
        </div>
    </script>

    <script>
        var app = angular.module('erpApp', ['ngRoute']);
        
        app.config(['$routeProvider', function($routeProvider) {
            $routeProvider
            .when('/login', { templateUrl: 'login.html', controller: 'LoginCtrl' })
            .when('/admin/users', { templateUrl: 'user-list.html', controller: 'UserListCtrl' })
            .when('/admin/users/create', { templateUrl: 'user-create.html', controller: 'UserCreateCtrl' })
            .otherwise({ redirectTo: '/login' });
        }]);

        app.run(['$rootScope', '$location', function($rootScope, $location) {
            $rootScope.$on('$routeChangeSuccess', function() {
                $rootScope.activePath = $location.path();
            });
        }]);

        app.controller('LoginCtrl', ['$scope', '$location', function($scope, $location) {
            $scope.login = function() { $location.path('/admin/users'); };
        }]);

        app.controller('UserListCtrl', ['$scope', '$rootScope', function($scope, $rootScope) {
            if(!$rootScope.users) {
                // Initialize with unique objects to avoid reference issues
                $rootScope.users = [
                    {name: 'Aishwarya Murali', empId: 'GENX-2045', designation: 'Technical Manager'},
                    {name: 'Siddharth Nair', empId: 'GENX-2046', designation: 'Senior Developer'},
                    {name: 'Elena Gilbert', empId: 'GENX-2047', designation: 'Product Designer'},
                    {name: 'Rahul Khanna', empId: 'GENX-2048', designation: 'Operations Lead'}
                ];
            }
            $scope.users = $rootScope.users;
        }]);

        app.controller('UserCreateCtrl', ['$scope', '$rootScope', '$location', function($scope, $rootScope, $location) {
            $scope.newUser = {};
            $scope.showRightsModal = false;
            
            var modules = ['BOM Management', 'Purchase Requests', 'Quotation Analysis', 'Purchase Orders', 'GRN Tracking', 'IQC Quality Control', 'Stock Inventory'];
            $scope.rights = modules.map(function(m) {
                return {
                    name: m, expanded: m.includes('IQC'), all: false,
                    options: [{name:'Create', selected:false}, {name:'View', selected:false}, {name:'Modify', selected:false}, {name:'Delete', selected:false}, {name:'Approve', selected:false}]
                };
            });
            
            $scope.toggleAll = function(r) {
                r.options.forEach(function(o) { o.selected = r.all; });
            };

            $scope.saveUser = function() {
                if(!$rootScope.users) $rootScope.users = [];
                
                // CRITICAL: Clone object to avoid reference issues from form
                var userToSave = angular.copy($scope.newUser);
                if(!userToSave.name) userToSave.name = 'New User';
                if(!userToSave.empId) userToSave.empId = 'GENX-' + Math.floor(Math.random() * 10000);
                if(!userToSave.designation) userToSave.designation = 'Specialist';
                
                $rootScope.users.unshift(userToSave);
                $location.path('/admin/users');
            };
        }]);
    </script>
</body>
</html>

<div class="page-wrapper">
  <div class="card">
    <div class="modal-header" style="display: flex; align-items: center; gap: 15px; justify-content: flex-start;">
      <a routerLink="/admin/grn" class="btn btn-ghost" style="padding: 4px 8px; display: flex; align-items: center; justify-content: center; color: #64748b; text-decoration: none; border-radius: 6px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h2 class="page-title" style="margin: 0; color: var(--text-primary); font-weight: 800;">{{ isEditMode ? 'Edit' : 'New' }} GRN Details</h2>
    </div>

    <div class="modal-body pb-4">
      <!-- Top Form -->
      <div class="grn-form-grid">
        <div class="form-group">
          <label class="form-label text-primary">GRN No.<span class="req">*</span></label>
          <input type="text" [(ngModel)]="grnData.grn_no" disabled class="form-control" style="background:var(--bg-app);color:var(--text-muted)">
        </div>


        <div class="form-group">
          <label class="form-label text-primary">PO NO.<span class="req">*</span></label>
          <select [(ngModel)]="grnData.po_id" (change)="onPoChange($event)" [disabled]="isEditMode" class="form-control" [style.background]="isEditMode ? 'var(--bg-app)' : ''">
            <option value="">Select PO Number</option>
            <option *ngFor="let po of filteredPos" [value]="po.id">{{ po.po_no }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label text-primary">Vendor Name</label>
          <input type="text" [(ngModel)]="grnData.vendor_name" disabled class="form-control" style="background:var(--bg-app)">
        </div>

        <div class="form-group">
          <label class="form-label text-primary">PO Date<span class="req">*</span></label>
          <input type="date" [(ngModel)]="grnData.po_date" disabled class="form-control" style="background:var(--bg-app)">
        </div>

        <div class="form-group">
          <label class="form-label text-primary">GRN Date<span class="req">*</span></label>
          <input type="date" [(ngModel)]="grnData.grn_date" class="form-control">
        </div>

        <div class="form-group">
          <label class="form-label text-primary">GRN Location<span class="req">*</span></label>
          <select [(ngModel)]="grnData.warehouse" class="form-control">
            <option value="">Select Location</option>
            <option value="KSIDC">KSIDC</option>
            <option value="KINFRA">KINFRA</option>
            <option value="CDAC">CDAC</option>
          </select>
        </div>


        <div class="form-group">
          <label class="form-label text-primary">Project/Product ID</label>
          <input type="text" [(ngModel)]="grnData.project_id" disabled placeholder="00023400" class="form-control" style="background:var(--bg-app)">
        </div>

        <div class="form-group">
          <label class="form-label text-primary" style="display: flex; align-items: center; gap: 6px; font-weight:700;">
            📄 Upload Overall Bill
          </label>
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="file" #grnFileInput (change)="onOverallBillUpload($event)" style="display:none" accept=".pdf,image/*">
            <button type="button" (click)="grnFileInput.click()" class="btn btn-ghost" style="padding: 10px 16px; font-size:13px; height: 42px; display: flex; align-items: center; gap: 8px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: white; font-weight: 700; flex: 1;">
              {{ grnData.bill_url ? '✅ Bill Attached' : '📁 Choose Bill File' }}
            </button>
            <button type="button" *ngIf="grnData.bill_url" (click)="viewFile(grnData.bill_url)" class="btn-view-bill" style="border: 1.5px solid #e2e8f0; background: white; padding: 0; width: 42px; height: 42px; color: #2563eb; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.2s;" title="View Bill">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <button type="button" *ngIf="grnData.bill_url" (click)="grnData.bill_url = null; grnFileInput.value = ''" style="border: none; background: transparent; padding: 4px; color: #ef4444; cursor: pointer; display: flex; align-items: center;" title="Remove Bill">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Pagination Top Bar -->
      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0 6px;">
        <span style="font-size:13px; font-weight:600; color:#64748b;">
          Page {{ currentPage }} of {{ totalPages > 0 ? totalPages : 1 }}
        </span>
        <div style="display:flex; gap:6px;">
          <button (click)="prevPage()" [disabled]="currentPage === 1"
                  style="width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:1.5px solid #e2e8f0; border-radius:8px; background:white; cursor:pointer; transition:all 0.2s;"
                  [style.opacity]="currentPage === 1 ? '0.35' : '1'">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#475569" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button (click)="nextPage()" [disabled]="currentPage === totalPages"
                  style="width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:1.5px solid #e2e8f0; border-radius:8px; background:white; cursor:pointer; transition:all 0.2s;"
                  [style.opacity]="currentPage === totalPages ? '0.35' : '1'">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#475569" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <!-- Items Table -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Sl No.</th>
              <th>Item Name</th>
              <th>UOM</th>
              <th>PO Qty</th>
              <th>Received Qty</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of paginatedItems; let i = index">
              <td>{{ getGlobalIndex(i) + 1 }}</td>
              <td style="font-weight:600">{{ item.item_name }}</td>
              <td>{{ item.uom }}</td>
              <td>{{ item.ordered_qty }}</td>
              <td>
                <input type="number" [(ngModel)]="item.received_qty" class="form-control" style="width:80px; text-align:center" min="0" [max]="item.ordered_qty">
              </td>
              <td>
                <input type="text" [(ngModel)]="item.remarks" class="form-control" placeholder="...">
              </td>
            </tr>
            <tr *ngIf="grnData.items.length === 0">
              <td colspan="6" style="text-align:center; padding: 20px; color:var(--text-muted)">Please select a PO to load items.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Submits -->
      <div class="modal-footer" style="background: #fff; margin-top:20px;">
        <button [routerLink]="['/admin/grn']" [queryParams]="{project: grnData.project_id}" class="btn btn-ghost">Cancel</button>
        <button (click)="onSubmit()" class="btn btn-primary">{{ isEditMode ? 'Update' : 'Save' }}</button>
      </div>

    </div>
  </div>
</div>

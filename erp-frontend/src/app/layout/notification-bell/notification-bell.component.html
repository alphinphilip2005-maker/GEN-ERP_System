<div class="notification-container">
  <button class="notif-btn" (click)="toggleDropdown($event)" [title]="unreadCount + ' unread notifications'">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
  </button>

  <div class="notif-dropdown" *ngIf="showDropdown" (click)="$event.stopPropagation()">
    <div class="notif-header">
      <h3>Notifications</h3>
      <button class="mark-all" (click)="markAllAsRead()" *ngIf="unreadCount > 0">Mark all as read</button>
    </div>

    <div class="notif-list">
      <div *ngIf="notifications.length === 0" class="empty-notif">
        No notifications found
      </div>

      <div *ngFor="let notif of notifications" 
           class="notif-item" 
           [class.unread]="!notif.is_read"
           (click)="markAsRead(notif, $event)">
        <div class="notif-icon" [ngClass]="notif.type.toLowerCase()">
          <span *ngIf="notif.type === 'BOM_UPLOAD'">📝</span>
          <span *ngIf="notif.type === 'BOM_APPROVAL'">✅</span>
          <span *ngIf="notif.type === 'INFO'">ℹ️</span>
        </div>
        <div class="notif-content">
          <p class="notif-message">{{ notif.message }}</p>
          <span class="notif-time">{{ notif.created_at | date:'short' }}</span>
          <a *ngIf="notif.link" 
             [routerLink]="notif.link" 
             class="notif-link" 
             (click)="$event.stopPropagation(); showDropdown = false">
            View
          </a>
        </div>
        <button class="delete-btn" (click)="deleteNotification(notif.id, $event)" title="Delete">
          &times;
        </button>
      </div>
    </div>
  </div>
</div>

<div class="dropdown-overlay" *ngIf="showDropdown" (click)="showDropdown = false"></div>
